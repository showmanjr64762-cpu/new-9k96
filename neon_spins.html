    <style>
select, select option {
  background-color: #070814 !important;
  color: #67e8f9 !important;
  font-family: inherit;
}
select option:hover, select option:focus, select option:checked {
  background-color: #164e63 !important;
  color: #ffffff !important;
}

@keyframes neonLiveFloat {
  0% {
    transform: scale(1.04) translate(0px, 0px);
    filter: brightness(0.85) contrast(1.15) saturate(1.2);
  }
  25% {
    transform: scale(1.08) translate(-10px, 6px);
    filter: brightness(0.95) contrast(1.2) saturate(1.35) hue-rotate(5deg);
  }
  50% {
    transform: scale(1.05) translate(8px, -8px);
    filter: brightness(0.82) contrast(1.12) saturate(1.18) hue-rotate(-4deg);
  }
  75% {
    transform: scale(1.09) translate(-6px, -10px);
    filter: brightness(1.0) contrast(1.22) saturate(1.4) hue-rotate(8deg);
  }
  100% {
    transform: scale(1.04) translate(0px, 0px);
    filter: brightness(0.85) contrast(1.15) saturate(1.2);
  }
}

@keyframes neonAuraPulse {
  0%, 100% { opacity: 0.35; transform: scale(1); }
  50% { opacity: 0.7; transform: scale(1.1); }
}

.neon-live-bg-img {
  animation: neonLiveFloat 16s ease-in-out infinite alternate;
  will-change: transform, filter;
  transform-origin: center center;
}

.neon-aura-live {
  animation: neonAuraPulse 6s ease-in-out infinite alternate;
}
