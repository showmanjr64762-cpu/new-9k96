            (document.body || document.documentElement).appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
          } catch(err) {
            console.log("[ALERT]", msg);
          }
        };

  let musicTimer = null;
  let musicStep = 0;

      masterGainNode = audioCtx.createGain();

      // SFX Gain
      sfxGainNode = audioCtx.createGain();
      sfxGainNode.gain.value = sfxVol;

      // Background Music Gain
      musicGainNode = audioCtx.createGain();
      musicGainNode.gain.value = musicVol;

      sfxGainNode.connect(masterGainNode);
      musicGainNode.connect(masterGainNode);
      masterGainNode.connect(audioCtx.destination);

        if (!isMuted) {

        }

  const NOTES = {
    C2: 65.41, F2: 87.31, G2: 98.00, A2: 110.00,
    C3: 130.81, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00, B3: 246.94,
    C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
    C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880.00
  };

  // 4-Bar Motivational Chord Progression: C Major -> G Major -> A Minor -> F Major
  const BARS = [
    { root: NOTES.C2, chord: [NOTES.C4, NOTES.E4, NOTES.G4, NOTES.C5], arpeggio: [NOTES.C4, NOTES.E4, NOTES.G4, NOTES.C5, NOTES.E5, NOTES.C5, NOTES.G4, NOTES.E4] },
    { root: NOTES.G2, chord: [NOTES.G3, NOTES.B3, NOTES.D4, NOTES.G4], arpeggio: [NOTES.G3, NOTES.B3, NOTES.D4, NOTES.G4, NOTES.D5, NOTES.G4, NOTES.D4, NOTES.B3] },
    { root: NOTES.A2, chord: [NOTES.A3, NOTES.C4, NOTES.E4, NOTES.A4], arpeggio: [NOTES.A3, NOTES.C4, NOTES.E4, NOTES.A4, NOTES.E5, NOTES.A4, NOTES.E4, NOTES.C4] },
    { root: NOTES.F2, chord: [NOTES.F3, NOTES.A3, NOTES.C4, NOTES.F4], arpeggio: [NOTES.F3, NOTES.A3, NOTES.C4, NOTES.F4, NOTES.C5, NOTES.F4, NOTES.C4, NOTES.A3] }
  ];

  function startBackgroundMusic() {
    if (isMusicPlaying) return;
    const ctx = initAudioContext();
    if (!ctx) return;

    isMusicPlaying = true;
    musicStep = 0;

    // ~124 BPM = 16th note step every 121ms
    const stepDuration = 0.121; // seconds

    musicTimer = setInterval(() => {
      if (isMuted || !isMusicPlaying || !audioCtx) return;

      try {
        const now = audioCtx.currentTime;
        const currentBarIdx = Math.floor(musicStep / 16) % BARS.length;
        const barStep = musicStep % 16;
        const bar = BARS[currentBarIdx];

        // 1. Driving Bass Synth Pulse (On step 0, 4, 8, 12)
        if (barStep % 4 === 0) {
          const bassOsc = audioCtx.createOscillator();
          const bassGain = audioCtx.createGain();
          const bassFilter = audioCtx.createBiquadFilter();

          bassOsc.type = 'sawtooth';
          bassOsc.frequency.setValueAtTime(bar.root, now);

          bassFilter.type = 'lowpass';
          bassFilter.frequency.setValueAtTime(280, now);
          bassFilter.frequency.exponentialRampToValueAtTime(80, now + 0.22);

          bassGain.gain.setValueAtTime(0.26, now);
          bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

          bassOsc.connect(bassFilter);
          bassFilter.connect(bassGain);
          bassGain.connect(musicGainNode);

          bassOsc.start(now);
          bassOsc.stop(now + 0.26);
        }

        // 2. Uplifting Arpeggio Lead Note (Every step)
        const arpNoteFreq = bar.arpeggio[barStep % bar.arpeggio.length];
        if (arpNoteFreq) {
          const arpOsc = audioCtx.createOscillator();
          const arpGain = audioCtx.createGain();
          const arpFilter = audioCtx.createBiquadFilter();

          arpOsc.type = 'triangle';
          arpOsc.frequency.setValueAtTime(arpNoteFreq, now);

          arpFilter.type = 'lowpass';
          arpFilter.frequency.setValueAtTime(1400, now);
          arpFilter.frequency.exponentialRampToValueAtTime(400, now + 0.11);

          arpGain.gain.setValueAtTime(0.12, now);
          arpGain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

          arpOsc.connect(arpFilter);
          arpFilter.connect(arpGain);
          arpGain.connect(musicGainNode);

          arpOsc.start(now);
          arpOsc.stop(now + 0.12);
        }

        // 3. Warm Ambient Pad Chord (On step 0 of each bar)
        if (barStep === 0) {
          bar.chord.forEach((freq, idx) => {
            const padOsc = audioCtx.createOscillator();
            const padGain = audioCtx.createGain();
            const padFilter = audioCtx.createBiquadFilter();

            padOsc.type = 'sawtooth';
            padOsc.frequency.setValueAtTime(freq, now);

            padFilter.type = 'lowpass';
            padFilter.frequency.setValueAtTime(650 + idx * 100, now);

            padGain.gain.setValueAtTime(0.001, now);
            padGain.gain.linearRampToValueAtTime(0.06, now + 0.2);
            padGain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);

            padOsc.connect(padFilter);
            padFilter.connect(padGain);
            padGain.connect(musicGainNode);

            padOsc.start(now);
            padOsc.stop(now + 1.85);
          });
        }

        // 4. Energetic Rhythmic Percussion Tick (On even steps)
        if (barStep % 2 === 0) {
          const tickNoise = audioCtx.createBufferSource();
          tickNoise.buffer = getNoiseBuffer(audioCtx);

          const tickFilter = audioCtx.createBiquadFilter();
          tickFilter.type = 'highpass';
          tickFilter.frequency.setValueAtTime(6000, now);

          const tickGain = audioCtx.createGain();
          tickGain.gain.setValueAtTime(barStep % 4 === 2 ? 0.04 : 0.02, now);
          tickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

          tickNoise.connect(tickFilter);
          tickFilter.connect(tickGain);
          tickGain.connect(musicGainNode);

          tickNoise.start(now);
          tickNoise.stop(now + 0.05);
        }

        musicStep++;
      } catch (e) {
        console.warn('Music step error:', e);
      }
    }, Math.round(stepDuration * 1000));
  }

  function stopBackgroundMusic() {
    if (musicTimer) {
      clearInterval(musicTimer);
      musicTimer = null;
    }
    isMusicPlaying = false;
  }

  /**
   * Play Takeoff SFX
   * Uplifting rocket/jet launch chime
   */
  function playTakeoffSFX() {
    const ctx = initAudioContext();
    if (!ctx || isMuted) return;

    const now = ctx.currentTime;

    // Rising chime chord
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + idx * 0.08);

      gain.gain.setValueAtTime(0.001, now + idx * 0.08);
      gain.gain.linearRampToValueAtTime(0.2, now + idx * 0.08 + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.6);

      osc.connect(gain);
      gain.connect(sfxGainNode);

      osc.start(now + idx * 0.08);
      osc.stop(now + idx * 0.08 + 0.65);
    });
  }

  /**
   * Crash / Flew Away SFX
   * Clean explosion impact chime
   */
  function playCrashSFX() {
    const ctx = initAudioContext();
    if (!ctx || isMuted) return;

    const now = ctx.currentTime;

    // Sub-bass impact
    const subOsc = ctx.createOscillator();
    const subGain = ctx.createGain();

    subOsc.type = 'sine';
    subOsc.frequency.setValueAtTime(150, now);
    subOsc.frequency.exponentialRampToValueAtTime(30, now + 0.4);

    subGain.gain.setValueAtTime(0.5, now);
    subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

    subOsc.connect(subGain);
    subGain.connect(sfxGainNode);

    subOsc.start(now);
    subOsc.stop(now + 0.45);

    // Filtered impact noise
    const noise = ctx.createBufferSource();
    noise.buffer = getNoiseBuffer(ctx);

    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'lowpass';
    noiseFilter.frequency.setValueAtTime(1800, now);
    noiseFilter.frequency.exponentialRampToValueAtTime(100, now + 0.5);

    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.4, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);

    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(sfxGainNode);

    noise.start(now);
    noise.stop(now + 0.55);
  }

  // Global SFX dispatcher
  window.playSFX = function (sfxName) {
    if (isMuted) return;
    initAudioContext();
    switch (sfxName) {
      case 'takeoff':
        playTakeoffSFX();
        break;
      case 'crash':
        playCrashSFX();
        break;
      case 'cashout':
        playCashoutSFX();
        break;
      case 'bet':
        playBetSFX();
        break;
      case 'tick':
      case 'beep':
        playTickSFX();
        break;
      case 'click':
        playClickSFX();
        break;
      default:
        playClickSFX();
        break;
    }
  };

  // --- Real-time Game Observer Loop ---
  function observeGameState() {
    const countdownEl = document.getElementById('countdown-hud');
    const crashEl = document.getElementById('crash-hud');
    const canvasContainer = document.getElementById('aviator-canvas-container');

    let currentPhase = 'waiting';

    if (crashEl) {
      currentPhase = 'crashed';
    } else if (countdownEl) {
      currentPhase = 'waiting';
    } else if (canvasContainer) {
      const multiplierEl = document.querySelector('#canvas-center-overlay h1, #canvas-center-overlay span');
      if (multiplierEl) {
        currentPhase = 'flying';
      }
    }

    // Phase transition triggers for SFX
    if (currentPhase !== lastPhase) {
      if (currentPhase === 'flying' && lastPhase !== 'flying') {
        playTakeoffSFX();
      } else if (currentPhase === 'crashed' && lastPhase === 'flying') {
        playCrashSFX();
      }
      lastPhase = currentPhase;
    }

    // Countdown radar tick triggers
    if (countdownEl) {
      const timerTxt = countdownEl.innerText || countdownEl.textContent || '';
      const secMatch = timerTxt.match(/(\d+\.\d+|\d+)s/);
      if (secMatch) {
        const sec = Math.floor(parseFloat(secMatch[1]));
        if (sec !== lastCountdownSecond && sec >= 0 && sec <= 5) {
          lastCountdownSecond = sec;
          playTickSFX();
        }
      }
    }

    // Ensure sound button exists in navbar
    ensureSoundButtonInNavbar();

    // Auto start background music if unlocked and not muted
    if (!isMuted && !isMusicPlaying && audioCtx && audioCtx.state === 'running') {
      startBackgroundMusic();
    }

    requestAnimationFrame(observeGameState);
  }

  // --- Initialize Observer ---
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      observeGameState();
    });
  } else {
    observeGameState();
  }

  // Also expose sound engine on window
  window.soundEngine = {
    playSFX: window.playSFX,
    toggleMute: toggleMute,
    openSettings: openSoundSettingsModal,
    startBackgroundMusic: startBackgroundMusic,
    stopBackgroundMusic: stopBackgroundMusic
  };

  console.log('✈ Aviator Sound Engine (Motivational Music & 1-Click Toggle) loaded.');
})();

</script></body></html>
